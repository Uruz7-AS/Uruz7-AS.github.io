<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Snake con Imágenes - GitHub Pages</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 10px;
        }

        .puntuacion-container {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        canvas {
            border: 4px solid #0f3460;
            background-color: #16213e;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            /* Importante: Mantenemos el suavizado de imágenes desactivado para arte de píxeles */
            image-rendering: pixelated; 
        }

        .instrucciones {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #a0a0a0;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ff6b81;
        }
    </style>
</head>
<body>

    <h1>Juego de Snake 🐍 (con Imágenes)</h1>
    <div class="puntuacion-container">Puntos: <span id="puntuacion">0</span> / 67</div>
    
    <!-- Mantenemos el tamaño del lienzo para que la lógica de juego no cambie -->
    <canvas id="gameCanvas" width="800" height="800"></canvas>
    
    <button onclick="reiniciarJuego()">Reiniciar / Iniciar</button>
    
    <div class="instrucciones">
        Usa <strong>WASD</strong> o las flechas para mover la serpiente.
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const puntuacionElemento = document.getElementById("puntuacion");

        // --- NUEVO: CARGA DE IMÁGENES ---
        // 1. Creamos los objetos de imagen
        const imagenCabeza = new Image();
        const imagenComida = new Image();

        // 2. Asignamos las rutas (asegúrate de que los nombres coincidan con tus archivos en GitHub)
        imagenCabeza.src = 'cabeza_serpiente.png'; 
        imagenComida.src = 'comida.png';

        // Variable para rastrear si las imágenes se han cargado
        let imagenesCargadas = 0;
        const totalImagenes = 2;

        // Función que se ejecuta cuando una imagen se carga correctamente
        function imagenCargada() {
            imagenesCargadas++;
            // Solo iniciamos el bucle si todas las imágenes están listas
            if (imagenesCargadas === totalImagenes) {
                reiniciarJuego(); 
            }
        }

        // Asignamos el evento de carga a cada imagen
        imagenCabeza.onload = imagenCargada;
        imagenComida.onload = imagenCargada;

        // Si hay un error cargando las imágenes, mostramos un aviso
        imagenCabeza.onerror = () => alert("Error cargando cabeza_serpiente.png. Asegúrate de que el archivo existe en tu repositorio.");
        imagenComida.onerror = () => alert("Error cargando comida.png. Asegúrate de que el archivo existe en tu repositorio.");
        // ---------------------------------

        const tamanoCuadro = 20; // El tamaño lógico del cuadro sigue siendo 20x20 para el movimiento
        const totalCuadros = canvas.width / tamanoCuadro;

        let serpiente = [{ x: 10, y: 10 }];
        let comida = { x: 15, y: 15 };
        let dx = 0;
        let dy = 0;
        let puntuacion = 0;
        let bucleJuego = null;
        let juegoIniciado = false;

        document.addEventListener("keydown", cambiarDireccion);

        function iniciarBucle() {
            if (bucleJuego) clearInterval(bucleJuego);
            bucleJuego = setInterval(dibujarJuego, 100);
        }

        function dibujarJuego() {
            // Verificación de condición de victoria
            if (puntuacion >= 67) {
                alert("¡Felicidades! 🎉 Has alcanzado los 67 puntos y ganado el juego.");
                reiniciarJuego();
                return;
            }

            moverSerpiente();

            if (comprobarColision()) {
                alert("¡Juego terminado! Puntuación final: " + puntuacion);
                reiniciarJuego();
                return;
            }

            limpiarLienzo();
            dibujarComida();
            dibujarSerpiente();

            // Mostrar aviso en el lienzo antes de presionar una tecla
            if (!juegoIniciado && imagenesCargadas === totalImagenes) {
                ctx.fillStyle = "#ffffff";
                ctx.font = "16px Arial";
                ctx.textAlign = "center";
                ctx.fillText("Usa WASD o Flechas para empezar", canvas.width / 2, canvas.height / 2);
            }
        }

        function limpiarLienzo() {
            ctx.fillStyle = "#16213e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // --- MODIFICADO: DIBUJAR SERPIENTE CON IMAGEN ---
      function dibujarSerpiente() {
    serpiente.forEach((segmento) => {
        // Dibujamos cada segmento (cabeza y cuerpo) con la misma imagen
        ctx.drawImage(
            imagenCabeza, 
            segmento.x * tamanoCuadro, 
            segmento.y * tamanoCuadro, 
            tamanoCuadro, 
            tamanoCuadro
        );
    });
}
                } else {
                    // Para el cuerpo, podemos usar un color fijo o la misma imagen
                    // Aquí usamos un color para diferenciar, pero podrías usar otra imagen si quisieras
                    ctx.fillStyle = "#45b08c";
                    ctx.fillRect(segmento.x * tamanoCuadro, segmento.y * tamanoCuadro, tamanoCuadro - 2, tamanoCuadro - 2);
                }
            });
        }
        // -----------------------------------------------

        function moverSerpiente() {
            if (!juegoIniciado) return;

            const cabeza = { x: serpiente[0].x + dx, y: serpiente[0].y + dy };
            serpiente.unshift(cabeza);

            if (cabeza.x === comida.x && cabeza.y === comida.y) {
                puntuacion += 5; // Cada comida otorga 5 puntos
                puntuacionElemento.textContent = puntuacion;
                generarComida();
            } else {
                serpiente.pop();
            }
        }

        function cambiarDireccion(evento) {
            const tecla = evento.key.toLowerCase();

            const yendoArriba = dy === -1;
            const yendoAbajo = dy === 1;
            const yendoDerecha = dx === 1;
            const yendoIzquierda = dx === -1;

            if ((tecla === 'a' || tecla === 'arrowleft') && !yendoDerecha) {
                dx = -1; dy = 0; juegoIniciado = true;
            }
            if ((tecla === 'w' || tecla === 'arrowup') && !yendoAbajo) {
                dx = 0; dy = -1; juegoIniciado = true;
            }
            if ((tecla === 'd' || tecla === 'arrowright') && !yendoIzquierda) {
                dx = 1; dy = 0; juegoIniciado = true;
            }
            if ((tecla === 's' || tecla === 'arrowdown') && !yendoArriba) {
                dx = 0; dy = 1; juegoIniciado = true;
            }
        }

        function generarComida() {
            comida.x = Math.floor(Math.random() * totalCuadros);
            comida.y = Math.floor(Math.random() * totalCuadros);

            serpiente.forEach(segmento => {
                if (segmento.x === comida.x && segmento.y === comida.y) {
                    generarComida();
                }
            });
        }

        // --- MODIFICADO: DIBUJAR COMIDA CON IMAGEN ---
        function dibujarComida() {
            // Dibujamos la comida usando la imagen cargada
            ctx.drawImage(
                imagenComida, 
                comida.x * tamanoCuadro, 
                comida.y * tamanoCuadro, 
                tamanoCuadro, // Usamos el tamaño del cuadro (20)
                tamanoCuadro
            );
        }
        // ----------------------------------------------

        function comprobarColision() {
            const cabeza = serpiente[0];

            const colisionPared = cabeza.x < 0 || cabeza.x >= totalCuadros || cabeza.y < 0 || cabeza.y >= totalCuadros;
            if (colisionPared) return true;

            for (let i = 1; i < serpiente.length; i++) {
                if (cabeza.x === serpiente[i].x && cabeza.y === serpiente[i].y) {
                    return true;
                }
            }

            return false;
        }

        function reiniciarJuego() {
            // Solo reiniciar si las imágenes están cargadas
            if (imagenesCargadas < totalImagenes) return; 

            serpiente = [{ x: 10, y: 10 }];
            dx = 0;
            dy = 0;
            puntuacion = 0;
            juegoIniciado = false;
            puntuacionElemento.textContent = puntuacion;
            generarComida();
            iniciarBucle();
        }

        // Comentamos la llamada directa aquí, ahora reiniciarJuego() se llama 
        // automáticamente cuando las imágenes terminan de cargarse.
        // reiniciarJuego(); 
    </script>
</body>
</html>
