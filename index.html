<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Snake - GitHub Pages</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 10px;
        }

        .puntuacion-container {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        canvas {
            border: 4px solid #0f3460;
            background-color: #16213e;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            /* Mantiene el pixel art nítido al agrandar las imágenes */
            image-rendering: pixelated; 
        }

        .instrucciones {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #a0a0a0;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ff6b81;
        }
    </style>
</head>
<body>

    <h1>Juego de Snake 🐍</h1>
    <div class="puntuacion-container">Puntos: <span id="puntuacion">0</span> / 67</div>
    
    <canvas id="gameCanvas" width="450" height="450"></canvas>
    
    <button onclick="reiniciarJuego()">Reiniciar / Iniciar</button>
    
    <div class="instrucciones">
        Usa <strong>WASD</strong> o las <strong>Flechas</strong> para mover la serpiente.
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const puntuacionElemento = document.getElementById("puntuacion");

        // --- CARGA DE AUDIOS ---
        const sonidoComer = new Audio('comer.mp3');
        const sonidoVictoria = new Audio('victoria.mp3');
        const musicaFondo = new Audio('musica.mp3');
        
        // La música se repetirá en bucle mientras dure la partida
        musicaFondo.loop = true;
        musicaFondo.volume = 0.5; // Volumen al 50% para no opacar los efectos

        // --- CARGA DE IMÁGENES ---
        const imagenCabeza = new Image();
        const imagenComida = new Image();

        imagenCabeza.src = 'cabeza_serpiente.png'; 
        imagenComida.src = 'comida.png';

        let imagenesCargadas = 0;
        const totalImagenes = 2;

        function imagenCargada() {
            imagenesCargadas++;
            if (imagenesCargadas === totalImagenes) {
                reiniciarJuego(); 
            }
        }

        imagenCabeza.onload = imagenCargada;
        imagenComida.onload = imagenCargada;

        imagenCabeza.onerror = () => alert("Error al cargar cabeza_serpiente.png. Verifica que esté subido a tu repositorio.");
        imagenComida.onerror = () => alert("Error al cargar comida.png. Verifica que esté subido a tu repositorio.");

        // --- CONFIGURACIÓN DEL TAMAÑO DE BLOQUES ---
        const tamanoCuadro = 30; 
        const totalCuadros = canvas.width / tamanoCuadro;

        let serpiente = [{ x: 5, y: 5 }];
        let comida = { x: 10, y: 10 };
        let dx = 0;
        let dy = 0;
        let puntuacion = 0;
        let bucleJuego = null;
        let juegoIniciado = false;

        document.addEventListener("keydown", cambiarDireccion);

        function iniciarBucle() {
            if (bucleJuego) clearInterval(bucleJuego);
            bucleJuego = setInterval(dibujarJuego, 100);
        }

        function dibujarJuego() {
            moverSerpiente();

            // Condición de victoria (67 puntos exactos)
            if (puntuacion >= 67) {
                puntuacionElemento.textContent = 67; // Asegura visualmente 67/67
                limpiarLienzo();
                dibujarComida();
                dibujarSerpiente();
                
                // Pausar la música de fondo y reproducir audio de victoria
                musicaFondo.pause();
                musicaFondo.currentTime = 0;

                sonidoVictoria.currentTime = 0;
                sonidoVictoria.play().catch(e => console.log("Audio bloqueado por navegador:", e));

                setTimeout(() => {
                    alert("¡Felicidades! 🎉 Has alcanzado los 67 puntos y ganado el juego.");
                    reiniciarJuego();
                }, 50);
                return;
            }

            if (comprobarColision()) {
                // Detener la música si pierde
                musicaFondo.pause();
                musicaFondo.currentTime = 0;

                alert("¡Juego terminado! Puntuación final: " + puntuacion);
                reiniciarJuego();
                return;
            }

            limpiarLienzo();
            dibujarComida();
            dibujarSerpiente();

            if (!juegoIniciado && imagenesCargadas === totalImagenes) {
                ctx.fillStyle = "#ffffff";
                ctx.font = "16px Arial";
                ctx.textAlign = "center";
                ctx.fillText("Usa WASD o Flechas para empezar", canvas.width / 2, canvas.height / 2);
            }
        }

        function limpiarLienzo() {
            ctx.fillStyle = "#16213e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function dibujarSerpiente() {
            serpiente.forEach((segmento) => {
                ctx.drawImage(
                    imagenCabeza, 
                    segmento.x * tamanoCuadro, 
                    segmento.y * tamanoCuadro, 
                    tamanoCuadro, 
                    tamanoCuadro
                );
            });
        }

        function moverSerpiente() {
            if (!juegoIniciado) return;

            const cabeza = { x: serpiente[0].x + dx, y: serpiente[0].y + dy };
            serpiente.unshift(cabeza);

            if (cabeza.x === comida.x && cabeza.y === comida.y) {
                puntuacion += 5; // Suma 5 puntos
                
                // Limitar la puntuación mostrada a 67 máximo
                puntuacionElemento.textContent = Math.min(puntuacion, 67);

                // Reproducir sonido al comer
                sonidoComer.currentTime = 0; 
                sonidoComer.play().catch(e => console.log("Audio bloqueado por navegador:", e));

                generarComida();
            } else {
                serpiente.pop();
            }
        }

        function cambiarDireccion(evento) {
            const tecla = evento.key.toLowerCase();

            const yendoArriba = dy === -1;
            const yendoAbajo = dy === 1;
            const yendoDerecha = dx === 1;
            const yendoIzquierda = dx === -1;

            let seMovio = false;

            if ((tecla === 'a' || tecla === 'arrowleft') && !yendoDerecha) {
                dx = -1; dy = 0; seMovio = true;
            }
            if ((tecla === 'w' || tecla === 'arrowup') && !yendoAbajo) {
                dx = 0; dy = -1; seMovio = true;
            }
            if ((tecla === 'd' || tecla === 'arrowright') && !yendoIzquierda) {
                dx = 1; dy = 0; seMovio = true;
            }
            if ((tecla === 's' || tecla === 'arrowdown') && !yendoArriba) {
                dx = 0; dy = 1; seMovio = true;
            }

            // Iniciar música e interacción en el primer movimiento
            if (seMovio && !juegoIniciado) {
                juegoIniciado = true;
                musicaFondo.currentTime = 0;
                musicaFondo.play().catch(e => console.log("Audio de fondo bloqueado por navegador:", e));
            }
        }

        function generarComida() {
            comida.x = Math.floor(Math.random() * totalCuadros);
            comida.y = Math.floor(Math.random() * totalCuadros);

            serpiente.forEach(segmento => {
                if (segmento.x === comida.x && segmento.y === comida.y) {
                    generarComida();
                }
            });
        }

        function dibujarComida() {
            ctx.drawImage(
                imagenComida, 
                comida.x * tamanoCuadro, 
                comida.y * tamanoCuadro, 
                tamanoCuadro, 
                tamanoCuadro
            );
        }

        function comprobarColision() {
            const cabeza = serpiente[0];

            const colisionPared = cabeza.x < 0 || cabeza.x >= totalCuadros || cabeza.y < 0 || cabeza.y >= totalCuadros;
            if (colisionPared) return true;

            for (let i = 1; i < serpiente.length; i++) {
                if (cabeza.x === serpiente[i].x && cabeza.y === serpiente[i].y) {
                    return true;
                }
            }

            return false;
        }

        function reiniciarJuego() {
            if (imagenesCargadas < totalImagenes) return; 

            // Detener y reiniciar música de fondo al reiniciar el juego
            musicaFondo.pause();
            musicaFondo.currentTime = 0;

            serpiente = [{ x: 5, y: 5 }];
            dx = 0;
            dy = 0;
            puntuacion = 0;
            juegoIniciado = false;
            puntuacionElemento.textContent = 0;
            generarComida();
            iniciarBucle();
        }
    </script>
</body>
</html>
