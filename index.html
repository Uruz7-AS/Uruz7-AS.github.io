<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Snake - GitHub Pages</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 10px;
        }

        .puntuacion-container {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        canvas {
            border: 4px solid #0f3460;
            background-color: #16213e;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .instrucciones {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #a0a0a0;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ff6b81;
        }
    </style>
</head>
<body>

    <h1>Juego de Snake 🐍</h1>
    <div class="puntuacion-container">Puntos: <span id="puntuacion">0</span></div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <button onclick="reiniciarJuego()">Reiniciar / Iniciar</button>
    
    <div class="instrucciones">
        Usa las flechas del teclado (<strong>↑ ↓ ← →</strong>) para mover la serpiente.
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const puntuacionElemento = document.getElementById("puntuacion");

        const tamanoCuadro = 20;
        const totalCuadros = canvas.width / tamanoCuadro;

        let serpiente = [{ x: 10, y: 10 }];
        let comida = { x: 15, y: 15 };
        let dx = 0;
        let dy = 0;
        let puntuacion = 0;
        let bucleJuego = null;
        let juegoIniciado = false;

        document.addEventListener("keydown", cambiarDireccion);

        function iniciarBucle() {
            if (bucleJuego) clearInterval(bucleJuego);
            bucleJuego = setInterval(dibujarJuego, 100);
        }

        function dibujarJuego() {
            moverSerpiente();

            if (comprobarColision()) {
                alert("¡Juego terminado! Puntuación final: " + puntuacion);
                reiniciarJuego();
                return;
            }

            limpiarLienzo();
            dibujarComida();
            dibujarSerpiente();
        }

        function limpiarLienzo() {
            ctx.fillStyle = "#16213e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function dibujarSerpiente() {
            serpiente.forEach((segmento, indice) => {
                ctx.fillStyle = indice === 0 ? "#4ecca3" : "#45b08c";
                ctx.fillRect(segmento.x * tamanoCuadro, segmento.y * tamanoCuadro, tamanoCuadro - 2, tamanoCuadro - 2);
            });
        }

        function moverSerpiente() {
            if (!juegoIniciado) return;

            const cabeza = { x: serpiente[0].x + dx, y: serpiente[0].y + dy };
            serpiente.unshift(cabeza);

            if (cabeza.x === comida.x && cabeza.y === comida.y) {
                puntuacion += 10;
                puntuacionElemento.textContent = puntuacion;
                generarComida();
            } else {
                serpiente.pop();
            }
        }

        function cambiarDireccion(evento) {
            const TECLA_IZQ = 37;
            const TECLA_ARRIBA = 38;
            const TECLA_DER = 39;
            const TECLA_ABAJO = 40;

            const teclaPresionada = evento.keyCode;

            const yendoArriba = dy === -1;
            const yendoAbajo = dy === 1;
            const yendoDerecha = dx === 1;
            const yendoIzquierda = dx === -1;

           if ((tecla === 'a' || tecla === 'arrowleft') && !yendoDerecha) {
        dx = -1; dy = 0; juegoIniciado = true;
    }
    // Tecla 'w' o Flecha Arriba
    if ((tecla === 'w' || tecla === 'arrowup') && !yendoAbajo) {
        dx = 0; dy = -1; juegoIniciado = true;
    }
    // Tecla 'd' o Flecha Derecha
    if ((tecla === 'd' || tecla === 'arrowright') && !yendoIzquierda) {
        dx = 1; dy = 0; juegoIniciado = true;
    }
    // Tecla 's' o Flecha Abajo
    if ((tecla === 's' || tecla === 'arrowdown') && !yendoArriba) {
        dx = 0; dy = 1; juegoIniciado = true;
    }
        }

        function generarComida() {
            comida.x = Math.floor(Math.random() * totalCuadros);
            comida.y = Math.floor(Math.random() * totalCuadros);

            serpiente.forEach(segmento => {
                if (segmento.x === comida.x && segmento.y === comida.y) {
                    generarComida();
                }
            });
        }

        function dibujarComida() {
            ctx.fillStyle = "#e94560";
            ctx.fillRect(comida.x * tamanoCuadro, comida.y * tamanoCuadro, tamanoCuadro - 2, tamanoCuadro - 2);
        }

        function comprobarColision() {
            const cabeza = serpiente[0];

            const colisionPared = cabeza.x < 0 || cabeza.x >= totalCuadros || cabeza.y < 0 || cabeza.y >= totalCuadros;
            if (colisionPared) return true;

            for (let i = 1; i < serpiente.length; i++) {
                if (cabeza.x === serpiente[i].x && cabeza.y === serpiente[i].y) {
                    return true;
                }
            }

            return false;
        }

        function reiniciarJuego() {
            serpiente = [{ x: 10, y: 10 }];
            dx = 0;
            dy = 0;
            puntuacion = 0;
            juegoIniciado = false;
            puntuacionElemento.textContent = puntuacion;
            generarComida();
            iniciarBucle();
        }

        reiniciarJuego();
    </script>
</body>
</html>
